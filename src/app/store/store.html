<h1>Store</h1>

@for (item of items(); track item.id) {
<section>
  <h2>{{ item.name }}</h2>

  <p>{{ item.description }}</p>

  <button (click)="purchase(item.id)" [disabled]="!canAfford(item.id)">
    Purchase for
    @if (item.currency === 'money') {
    ${{ getCost(item.id) }}
    } @else {
    {{ getCost(item.id) }} Research
    }
  </button>
</section>
}
