<h1>Welcome to the lab, Professor Larch</h1>

<div>
  <p>Research: {{ game.research() }}</p>
  <p>Money: ${{ game.money() }}</p>
  <button (click)="addResearch()">Research</button>
  <button (click)="addMoney()">Work</button>
</div>

<app-pokemon></app-pokemon>

<h2>Jobs</h2>

<ul>
  @for (job of game.unlockedJobs(); track job) {
  <li>
    {{ job }}
  </li>
  }
</ul>
